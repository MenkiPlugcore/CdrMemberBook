# CdrMemberBook v1.5.2
config-version: 9
prefix: '&8[&dMOONSIGN&8] &r'

teleport:
  request-expire-seconds: 30
  request-cooldown-seconds: 5
  cancel-on-world-change: true
  block-cross-world: false
  sounds:
    request: BLOCK_NOTE_BLOCK_PLING
    accepted: ENTITY_PLAYER_LEVELUP
    denied: BLOCK_NOTE_BLOCK_BASS

# Icons for built-in Bedrock pages.
bedrock-icons:
  enabled: true
  tpa: textures/items/ender_pearl
  tpahere: textures/items/lead
  toggle: textures/items/lever
  player: textures/items/name_tag
  back: textures/items/arrow
  home: textures/items/bed_red
  home-add: textures/items/bed_red
  delete: textures/items/barrier
  refresh: textures/items/compass_item
  trade-send: textures/items/emerald
  trade-accept: textures/items/slimeball
  trade-deny: textures/items/barrier

# Member Book automatically opens the member menu on right click.
# Default v1.5.2: buku bebas dipindahkan di inventory player sendiri,
# tetapi tidak bisa disimpan ke chest, ender chest, PlayerVaults, shulker,
# plugin GUI, atau inventory lain di luar inventory player.
member-book:
  enabled: true
  bedrock-only: true
  give-on-join: true
  give-delay-ticks: 10
  permanent-hotbar: false
  # Legacy compatibility option. Mode default v1.5.2 tidak mengunci perpindahan internal.
  prevent-move: false
  prevent-external-storage: true
  # Dipakai oleh mode legacy permanent-hotbar.
  enforce-interval-ticks: 20
  # Slot awal saat buku pertama kali diberikan jika slot ini kosong.
  hotbar-slot: 8
  prevent-drop: true
  # Anti double-open form. 20 ticks = 1 detik; 0 = nonaktif.
  open-cooldown-ticks: 20

  # Safety & Recovery v1.4.0
  recovery:
    # Memulihkan buku yang hilang karena /clear, plugin lain, atau bug inventory.
    enabled: true
    # 100 ticks = 5 detik. Dibuat ringan dan tidak berjalan setiap tick.
    interval-ticks: 100
    # Cek ulang setelah player pindah world/server lifecycle.
    recover-on-world-change: true
    # Jika buku lolos ke container/GUI yang sedang dibuka, tarik kembali ke inventory player.
    recover-from-open-container: true
    # Bersihkan copy ganda di inventory/cursor player.
    remove-duplicates: true

  material: BOOK
  name: '&d&lMOONSIGN &fMember Book'
  lore:
  - '&7Klik kanan untuk membuka Menu Member.'
  - '&8Item menu pribadi MOONSIGN.'

  # Book Customization v1.4.1
  customization:
    # 0 = nonaktif. Cocok untuk resource pack Java / legacy Geyser custom item mapping.
    custom-model-data: 0
    # Format namespace:key, contoh: moonsign:member_book. Kosong = model vanilla.
    # Untuk Bedrock, model custom tetap membutuhkan Geyser custom mapping + Bedrock resource pack.
    item-model: ''
    # true = paksa glint, false = paksa tanpa glint, default = perilaku vanilla.
    enchant-glint: default
    # Menyembunyikan seluruh tooltip item. Jika true, nama/lore juga tidak terlihat di tooltip.
    hide-tooltip: false
    hide-attributes: false
    hide-additional-tooltip: false
    # ItemFlag Bukkit tambahan, contoh: [HIDE_ENCHANTS, HIDE_UNBREAKABLE]
    item-flags: []
    # Buku lama milik player online otomatis mengikuti tampilan config terbaru saat reload/join.
    refresh-existing: true

  # Dynamic Member Book v1.5.0
  dynamic:
    enabled: true
    # PlaceholderAPI bersifat optional. Jika tidak terpasang, placeholder bawaan tetap bekerja.
    placeholderapi: true
    built-in-placeholders: true
    # 200 ticks = 10 detik. Minimum internal 40 ticks agar tetap ringan.
    refresh-interval-ticks: 200
    refresh-on-join: true
    refresh-on-world-change: true
    # Built-in placeholders: %player%, %uuid%, %world%, %ping%, %online%
    # PlaceholderAPI examples: %luckperms_prefix%, %vault_eco_balance_formatted%, dll.

# Native integrations used by the Bedrock click-only flows.
integrations:
  essentials-home:
    # Home list + max home are read directly from EssentialsX.
    # Commands are still executed as the player so Essentials permissions/cooldowns stay active.
    set-command: 'sethome %home%'
    teleport-command: 'home %home%'
    delete-command: 'delhome %home%'
    # Tombol preset untuk Bedrock Set Home. Bisa diubah bebas.
    presets:
    - rumah
    - base
    - farm
    - tambang
    - shop
    # Tetap sediakan opsi input nama sendiri selain tombol preset.
    allow-custom-name: true
    # Urutkan daftar home aktual milik player secara alfabetis.
    sort-alphabetically: true
    # Tambahkan tombol Refresh Home di Home Manager.
    show-refresh-button: true

  pay:
    # %target% = selected online player, %amount% = manually entered nominal.
    command: 'pay %target% %amount%'

  axtrade:
    # AxTrade canonical commands. If you changed its aliases, edit these templates.
    send-command: 'axtrade %target%'
    accept-command: 'axtrade accept %target%'
    deny-command: 'axtrade deny %target%'
    toggle-command: 'axtrade toggle'

# Fully config-driven member menu.
# Button types:
#   command  = run any player/console command
#   teleport = open CdrMemberBook's built-in TPA flow
#   homes    = native Bedrock EssentialsX Home Manager
#   pay      = native Bedrock player picker + manual nominal input
#   trade    = native Bedrock AxTrade send/accept/deny/toggle flow
#   submenu  = open a submenu from menu.submenus
#   close    = close the menu
#
# For Java players, homes/pay/trade use their configured `command` as fallback.
# executor: player (default) or console
# Placeholders in names/commands: %player%, %world%; commands also support %uuid%.
menu:
  hide-buttons-without-permission: true

  main:
    title: '&d&lMOONSIGN &fMenu Member'
    content: '&7Pilih fitur yang ingin kamu buka.'
    buttons:
      teleport:
        enabled: true
        name: '&bMinta TP'
        type: teleport
        order: 10
        icon: textures/items/ender_pearl
        java-material: ENDER_PEARL
        permission: ''
        lore:
        - '&7Minta teleport ke player lain.'

      warp:
        enabled: true
        name: Warp
        type: command
        command: warp
        executor: player
        order: 20
        icon: textures/items/compass_item
        java-material: COMPASS
        permission: ''

      pwarp:
        enabled: true
        name: Player Warp
        type: command
        command: pwarp
        executor: player
        order: 30
        icon: textures/items/map_filled
        java-material: FILLED_MAP
        permission: ''

      sethome:
        enabled: true
        name: Home
        type: homes
        # Fallback untuk Java player.
        command: homes
        executor: player
        order: 40
        icon: textures/items/bed_red
        java-material: RED_BED
        permission: ''
        lore:
        - '&7Set, lihat, teleport, dan hapus home.'
        - '&7Bedrock: full klik tanpa ketik command.'

      land:
        enabled: true
        name: Tanah
        type: command
        command: claimslist
        executor: player
        order: 50
        icon: textures/items/map_empty
        java-material: GRASS_BLOCK
        permission: ''

      transfer:
        enabled: true
        name: Transfer
        type: pay
        # Fallback untuk Java player.
        command: pay
        executor: player
        order: 60
        icon: textures/items/paper
        java-material: PAPER
        permission: ''
        lore:
        - '&7Bedrock: pilih player lalu ketik nominal.'

      bank:
        enabled: true
        name: Bank
        type: command
        command: bank
        executor: player
        order: 70
        icon: textures/items/gold_ingot
        java-material: GOLD_INGOT
        permission: ''

      team:
        enabled: true
        name: Party
        type: command
        command: party
        executor: player
        order: 80
        icon: textures/items/iron_sword
        java-material: IRON_SWORD
        permission: ''

      shop:
        enabled: true
        name: Shop
        type: command
        # Sesuaikan jika command pembuka DGShop berbeda.
        command: shop
        executor: player
        order: 90
        icon: textures/items/nether_star
        java-material: NETHER_STAR
        permission: ''

      playershop:
        enabled: true
        name: Player Shop
        type: command
        command: ah
        executor: player
        order: 100
        icon: textures/items/name_tag
        java-material: NAME_TAG
        permission: ''

      report:
        enabled: true
        name: Lapor
        type: command
        command: report
        executor: player
        order: 110
        icon: textures/items/book_writable
        java-material: WRITABLE_BOOK
        permission: ''

      barter:
        enabled: true
        name: Barter
        type: trade
        # Fallback untuk Java player.
        command: axtrade
        executor: player
        order: 120
        icon: textures/items/lead
        java-material: LEAD
        permission: ''
        lore:
        - '&7Bedrock: kirim/terima/tolak trade dengan klik.'

      player-menu:
        enabled: false
        name: Menu Player
        type: submenu
        submenu: player
        order: 130
        icon: textures/items/name_tag
        java-material: PLAYER_HEAD
        permission: ''

      close:
        enabled: true
        name: Tutup
        type: close
        order: 999
        icon: textures/items/barrier
        java-material: BARRIER
        permission: ''

  submenus:
    player:
      title: '&dMenu Player'
      content: '&7Fitur pribadi player.'
      back-menu: main
      buttons:
        homes:
          enabled: true
          name: Homes
          type: homes
          command: homes
          executor: player
          order: 10
          icon: textures/items/bed_red
          java-material: RED_BED
          permission: ''

        balance:
          enabled: true
          name: Balance
          type: command
          command: balance
          executor: player
          order: 20
          icon: textures/items/gold_ingot
          java-material: GOLD_INGOT
          permission: ''

        enderchest:
          enabled: true
          name: Ender Chest
          type: command
          command: ec
          executor: player
          order: 30
          icon: textures/blocks/ender_chest_front
          java-material: ENDER_CHEST
          permission: ''

