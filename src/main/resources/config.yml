# CdrMemberBook v1.9.3
config-version: 20
prefix: '&8[&dCdrMemberBook&8] &r'

teleport:
  request-expire-seconds: 30
  request-cooldown-seconds: 5
  cancel-on-world-change: true
  block-cross-world: false
  sounds:
    request: BLOCK_NOTE_BLOCK_PLING
    accepted: ENTITY_PLAYER_LEVELUP
    denied: BLOCK_NOTE_BLOCK_BASS

# Icons for built-in Bedrock pages.
bedrock-icons:
  enabled: true
  tpa: textures/items/ender_pearl
  tpahere: textures/items/lead
  toggle: textures/items/lever
  player: textures/items/name_tag
  back: textures/items/arrow
  home: textures/items/bed_red
  tutorial: textures/items/book_written
  home-add: textures/items/bed_red
  delete: textures/items/barrier
  refresh: textures/items/compass_item
  trade-send: textures/items/emerald
  trade-accept: textures/items/slimeball
  trade-deny: textures/items/barrier

# Member Book automatically opens the member menu on right click.
# Default v1.6.0: buku bebas dipindahkan di inventory player sendiri,
# tetapi tidak bisa disimpan ke chest, ender chest, PlayerVaults, shulker,
# plugin GUI, atau inventory lain di luar inventory player.
member-book:
  enabled: true
  bedrock-only: true
  give-on-join: true
  give-delay-ticks: 10

  # Book Modes v1.6.0:
  # MOVABLE            = bebas di inventory sendiri + Safety/Recovery aktif.
  # LOCKED_HOTBAR      = dikunci dan dijaga tetap di hotbar-slot.
  # FIXED_SLOT_MOVABLE = boleh dipindah sementara, lalu otomatis kembali ke hotbar-slot.
  # NORMAL             = item biasa; tanpa recovery, anti-drop, anti-storage, atau slot enforcement.
  mode: MOVABLE

  # Legacy compatibility. Config lama dengan permanent-hotbar: true otomatis
  # dimigrasikan ke mode LOCKED_HOTBAR saat naik ke config-version 11.
  permanent-hotbar: false
  # Legacy compatibility option. `mode` v1.6.0 menjadi sumber utama behavior buku.
  prevent-move: false
  prevent-external-storage: true
  # Interval enforcement LOCKED_HOTBAR.
  enforce-interval-ticks: 20
  # Slot target 0-8 untuk LOCKED_HOTBAR/FIXED_SLOT_MOVABLE,
  # dan slot awal pemberian untuk MOVABLE/NORMAL jika kosong.
  hotbar-slot: 8
  fixed-slot:
    # FIXED_SLOT_MOVABLE mengembalikan buku ke hotbar-slot setelah delay ini.
    # 40 ticks = 2 detik.
    return-delay-ticks: 40
  prevent-drop: true
  # Anti double-open form. 20 ticks = 1 detik; 0 = nonaktif.
  open-cooldown-ticks: 20

  # Safety & Recovery v1.4.0
  recovery:
    # Memulihkan buku yang hilang karena /clear, plugin lain, atau bug inventory.
    enabled: true
    # 100 ticks = 5 detik. Dibuat ringan dan tidak berjalan setiap tick.
    interval-ticks: 100
    # Cek ulang setelah player pindah world/server lifecycle.
    recover-on-world-change: true
    # Jika buku lolos ke container/GUI yang sedang dibuka, tarik kembali ke inventory player.
    recover-from-open-container: true
    # Bersihkan copy ganda di inventory/cursor player.
    remove-duplicates: true

  material: BOOK
  name: '&d&lCdrMemberBook'
  lore:
  - '&7Klik kanan untuk membuka Menu Member.'
  - '&8Member Book dari CdrMemberBook.'

  # Book Customization v1.4.1
  customization:
    # 0 = nonaktif. Cocok untuk resource pack Java / legacy Geyser custom item mapping.
    custom-model-data: 0
    # Format namespace:key, contoh: cdrmemberbook:member_book. Kosong = model vanilla.
    # Untuk Bedrock, model custom tetap membutuhkan Geyser custom mapping + Bedrock resource pack.
    item-model: ''
    # true = paksa glint, false = paksa tanpa glint, default = perilaku vanilla.
    enchant-glint: default
    # Menyembunyikan seluruh tooltip item. Jika true, nama/lore juga tidak terlihat di tooltip.
    hide-tooltip: false
    hide-attributes: false
    hide-additional-tooltip: false
    # ItemFlag Bukkit tambahan, contoh: [HIDE_ENCHANTS, HIDE_UNBREAKABLE]
    item-flags: []
    # Buku lama milik player online otomatis mengikuti tampilan config terbaru saat reload/join.
    refresh-existing: true

  # Dynamic Member Book v1.5.0
  dynamic:
    enabled: true
    # PlaceholderAPI bersifat optional. Jika tidak terpasang, placeholder bawaan tetap bekerja.
    placeholderapi: true
    built-in-placeholders: true
    # 200 ticks = 10 detik. Minimum internal 40 ticks agar tetap ringan.
    refresh-interval-ticks: 200
    refresh-on-join: true
    refresh-on-world-change: true
    # Built-in placeholders: %player%, %uuid%, %world%, %ping%, %online%
    # PlaceholderAPI examples: %luckperms_prefix%, %vault_eco_balance_formatted%, dll.

# First Join Tutorial v1.7.0
# Hanya player baru yang ditandai eligible secara default. Jika form ditutup sebelum selesai,
# status eligible disimpan sehingga tutorial akan muncul lagi pada login berikutnya.
tutorial:
  enabled: true
  bedrock-only: true
  # false = player lama saat plugin di-update tidak otomatis diberi tutorial.
  show-to-existing-unseen: false
  # 60 ticks = 3 detik setelah join agar Floodgate/client sudah siap menerima form.
  delay-ticks: 60
  open-menu-after-complete: true

  welcome:
    title: '&d&lCdrMemberBook'
    content: '&fSelamat datang, &d%player%&f!\n&7Member Book adalah pusat menu pribadi kamu di server.'
    button: 'Lanjut'

  features:
    title: '&dMember Book'
    content: '&fDari Member Book kamu bisa membuka Home, TPA, Transfer, Barter, Shop, Party dan fitur server lainnya tanpa menghafal banyak command.'
    button: 'Lanjut'

  ready:
    title: '&aSiap Bermain'
    content: '&fKlik kanan Member Book kapan saja untuk membuka Menu Member.\n&7Kalau buku hilang pada mode aman, sistem recovery akan membantu memulihkannya.'
    button: 'Mulai'

# Native integrations used by the Bedrock click-only flows.
integrations:
  essentials-home:
    # Home list + max home are read directly from EssentialsX.
    # Commands are still executed as the player so Essentials permissions/cooldowns stay active.
    set-command: 'sethome %home%'
    teleport-command: 'home %home%'
    delete-command: 'delhome %home%'
    # Tombol preset untuk Bedrock Set Home. Bisa diubah bebas.
    presets:
    - rumah
    - base
    - farm
    - tambang
    - shop
    # Tetap sediakan opsi input nama sendiri selain tombol preset.
    allow-custom-name: true
    # Urutkan daftar home aktual milik player secara alfabetis.
    sort-alphabetically: true
    # Tambahkan tombol Refresh Home di Home Manager.
    show-refresh-button: true
    # Preset yang player tidak punya permission disembunyikan dari Set Home.
    # false = preset tetap tampil dengan label Terkunci.
    hide-locked-presets: true
    # Pakai display-name + icon preset juga pada Teleport/Hapus home yang sudah dimiliki.
    use-display-names-on-owned-homes: true

    # Metadata advanced per preset. Key harus sama dengan nama di list `presets`.
    # `permission` kosong = semua player boleh Set/Timpa preset tersebut.
    # Permission hanya membatasi Set/Timpa. Home yang sudah dimiliki tetap bisa diteleport/hapus.
    preset-details:
      rumah:
        enabled: true
        display-name: 'Rumah'
        icon: textures/items/bed_red
        permission: ''
      base:
        enabled: true
        display-name: 'Base'
        icon: textures/items/bed_red
        permission: ''
      farm:
        enabled: true
        display-name: 'Farm'
        icon: textures/items/wheat
        permission: ''
      tambang:
        enabled: true
        display-name: 'Tambang'
        icon: textures/items/iron_pickaxe
        permission: ''
      shop:
        enabled: true
        display-name: 'Shop'
        icon: textures/items/emerald
        permission: ''

  pay:
    # %target% = selected online player, %amount% = manually entered nominal.
    command: 'pay %target% %amount%'

  axtrade:
    # AxTrade canonical commands. If you changed its aliases, edit these templates.
    send-command: 'axtrade %target%'
    accept-command: 'axtrade accept %target%'
    deny-command: 'axtrade deny %target%'
    toggle-command: 'axtrade toggle'

  report:
    # Built-in native Bedrock report flow. Tidak membutuhkan plugin report eksternal.
    enabled: true
    cooldown-seconds: 60
    min-reason-length: 3
    max-reason-length: 200
    # Bersihkan newline/control character dari alasan sebelum disimpan/log/hook.
    sanitize-control-characters: true
    # Jumlah report per halaman untuk /cdrmemberbook reports.
    admin-page-size: 8
    staff-permission: 'cdrmemberbook.staff.report'
    # Optional hook setelah report tersimpan. Placeholder: %id%, %reporter%, %target%, %reason%.
    console-command: ''
    # Native Bedrock staff Report Center. Java staff UI akan ditambahkan terpisah.
    center:
      enabled: true
      page-size: 8
      allow-delete: true

# Fully config-driven member menu.
# Button types:
#   command  = run any player/console command
#   teleport = open CdrMemberBook's built-in TPA flow
#   homes    = native Bedrock EssentialsX Home Manager
#   pay      = native Bedrock player picker + manual nominal input
#   trade    = native Bedrock AxTrade send/accept/deny/toggle flow
#   report-center = native Bedrock staff Report Center
#   submenu  = open a submenu from menu.submenus
#   close    = close the menu
# Advanced actions v1.9.0: optional `actions:` list overrides legacy single action.
# Types: command, console-command, message, sound, close, open-menu, delay.
# Conditions v1.9.1: platform ANY/JAVA/BEDROCK, worlds, excluded-worlds, permissions,
# min-online/max-online, dan placeholder comparisons (==, !=, contains, >, >=, <, <=).
#
# For Java players, homes/pay/trade use their configured `command` as fallback.
# executor: player (default) or console
# Placeholders in names/commands: %player%, %world%; commands also support %uuid%.
menu:
  hide-buttons-without-permission: true
  # Sembunyikan tombol jika dependency/command penyedianya tidak tersedia.
  hide-unavailable-buttons: true
  # Untuk type: command, command root dicek otomatis. Contoh /bank tidak ada -> tombol Bank hilang.
  auto-detect-command-dependencies: true
  # Warning startup/reload untuk type/material/submenu config yang salah.
  log-invalid-buttons: true
  actions:
    enabled: true
    # Anti-spam click untuk action chain. 10 ticks = 0.5 detik.
    click-cooldown-ticks: 10
    # Safety caps agar config yang salah tidak membuat chain/scheduler berlebihan.
    max-actions-per-chain: 32
    max-total-delay-ticks: 1200
    # false = action berikutnya tetap dicoba jika satu action gagal.
    stop-on-error: false
  conditions:
    # Izinkan PlaceholderAPI untuk evaluasi conditions.placeholder(s).
    placeholderapi: true
    max-placeholder-conditions: 16
    max-value-length: 512

  main:
    title: '&d&lCdrMemberBook &fMenu'
    content: '&7Pilih fitur yang ingin kamu buka.'
    buttons:
