name: CdrMemberBook
version: '1.8.1'
main: id.cadera.memberbook.CdrMemberBookPlugin
api-version: '1.21'
author: CADERA
description: Config-driven Bedrock/Java member menu with smart integrations, native reports, homes, pay and trade flows.
softdepend:
  - floodgate
  - Essentials
  - AxTrade
  - PlaceholderAPI

commands:
  menu:
    description: Open CdrMemberBook member menu or reload its config.
    usage: /menu [reload]
    permission: cdrmemberbook.menu
  cdrmemberbook:
    description: Admin tools for Member Book give, remove, repair and recovery.
    usage: /cdrmemberbook <give|remove|fix|refresh|status|tutorialreset|tutorialshow> <player>
    permission: cdrmemberbook.admin.memberbook
  tpa:
    description: Request teleport to another player.
    usage: /tpa <player>
    permission: cdrmemberbook.tpa
  tpahere:
    description: Request another player to teleport to you.
    usage: /tpahere <player>
    permission: cdrmemberbook.tpahere
  tpaccept:
    description: Accept your pending teleport request.
    usage: /tpaccept
    aliases: [tpyes]
    permission: cdrmemberbook.tpaccept
  tpdeny:
    description: Deny your pending teleport request.
    usage: /tpdeny
    aliases: [tpno]
    permission: cdrmemberbook.tpdeny
  tptoggle:
    description: Enable or disable incoming teleport requests.
    usage: /tptoggle
    permission: cdrmemberbook.tptoggle

permissions:
  cdrmemberbook.menu:
    default: true
  cdrmemberbook.tpa:
    default: true
  cdrmemberbook.tpahere:
    default: true
  cdrmemberbook.tpaccept:
    default: true
  cdrmemberbook.tpdeny:
    default: true
  cdrmemberbook.tptoggle:
    default: true
  cdrmemberbook.admin.reload:
    default: op
  cdrmemberbook.admin.memberbook:
    default: op
  cdrmemberbook.staff.report:
    default: op
  cdrmemberbook.bypass.cooldown:
    default: op
  cdrmemberbook.bypass.disabled:
    default: op
  # Legacy permission aliases from pre-v1.8.1 builds.
  # Keep these so existing LuckPerms assignments continue to grant the new CdrMemberBook nodes.
  moonsignmenu.menu:
    default: false
    children:
      cdrmemberbook.menu: true
  moonsignmenu.tpa:
    default: false
    children:
      cdrmemberbook.tpa: true
  moonsignmenu.tpahere:
    default: false
    children:
      cdrmemberbook.tpahere: true
  moonsignmenu.tpaccept:
    default: false
    children:
      cdrmemberbook.tpaccept: true
  moonsignmenu.tpdeny:
    default: false
    children:
      cdrmemberbook.tpdeny: true
  moonsignmenu.tptoggle:
    default: false
    children:
      cdrmemberbook.tptoggle: true
  moonsignmenu.admin.reload:
    default: false
    children:
      cdrmemberbook.admin.reload: true
  moonsignmenu.admin.memberbook:
    default: false
    children:
      cdrmemberbook.admin.memberbook: true
  moonsignmenu.staff.report:
    default: false
    children:
      cdrmemberbook.staff.report: true
  moonsignmenu.bypass.cooldown:
    default: false
    children:
      cdrmemberbook.bypass.cooldown: true
  moonsignmenu.bypass.disabled:
    default: false
    children:
      cdrmemberbook.bypass.disabled: true
