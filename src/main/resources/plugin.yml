name: CdrMemberBook
version: '1.11.0.1'
main: id.cadera.memberbook.CdrMemberBookPlugin
api-version: '1.21'
author: CADERA
description: Config-driven Bedrock/Java member menu with smart integrations, native reports, homes, pay and trade flows.
softdepend:
  - floodgate
  - Essentials
  - AxTrade
  - PlaceholderAPI

commands:
  menu:
    description: Open CdrMemberBook member menu or reload its config.
    usage: /menu [reload]
    permission: cdrmemberbook.menu
  cdrmemberbook:
    description: Admin tools for Member Book give, remove, repair and recovery.
    usage: /cdrmemberbook <give|remove|fix|refresh|status|tutorialreset|tutorialshow> <player>
    permission: cdrmemberbook.admin.memberbook
  tpa:
    description: Request teleport to another player.
    usage: /tpa <player>
    permission: cdrmemberbook.tpa
  tpahere:
    description: Request another player to teleport to you.
    usage: /tpahere <player>
    permission: cdrmemberbook.tpahere
  tpaccept:
    description: Accept your pending teleport request.
    usage: /tpaccept
    aliases: [tpyes]
    permission: cdrmemberbook.tpaccept
  tpdeny:
    description: Deny your pending teleport request.
    usage: /tpdeny
    aliases: [tpno]
    permission: cdrmemberbook.tpdeny
  tptoggle:
    description: Enable or disable incoming teleport requests.
    usage: /tptoggle
    permission: cdrmemberbook.tptoggle

permissions:
  cdrmemberbook.menu:
    default: true
  cdrmemberbook.tpa:
    default: true
  cdrmemberbook.tpahere:
    default: true
  cdrmemberbook.tpaccept:
    default: true
  cdrmemberbook.tpdeny:
    default: true
  cdrmemberbook.tptoggle:
    default: true
  cdrmemberbook.admin.reload:
    default: op
  cdrmemberbook.admin.memberbook:
    default: op
  cdrmemberbook.staff.report:
    default: op
  cdrmemberbook.bypass.cooldown:
    default: op
  cdrmemberbook.bypass.disabled:
    default: op
