name: Rebrand CdrMemberBook v1.8.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-v1.8.1.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.8.1 rebrand cleanup
        run: python3 .github/scripts/rebrand_v181.py

      - name: Build with Maven
        run: mvn -B clean package

      - name: Commit v1.8.1
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src
          git commit -m "chore: rebrand public UI to CdrMemberBook v1.8.1"
          git push
