name: Upgrade CdrMemberBook v1.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v1.5.0.yml'
      - '.github/scripts/upgrade_v150.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.5.0 dynamic update
        run: python3 .github/scripts/upgrade_v150.py

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Commit v1.5.0
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add Dynamic Member Book v1.5.0"
          git push origin HEAD:main
