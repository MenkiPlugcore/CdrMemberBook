name: Upgrade CdrMemberBook v1.4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v1.4.1.yml'
      - '.github/scripts/upgrade_v141.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.4.1 customization update
        run: python3 .github/scripts/upgrade_v141.py

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Commit v1.4.1
        run: |
          git config user.name 'MenkiPlugcore'
          git config user.email 'cfirmansyah327@gmail.com'
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add Member Book customization v1.4.1'
          git push origin HEAD:main
