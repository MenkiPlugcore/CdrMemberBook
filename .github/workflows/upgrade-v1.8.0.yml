name: Upgrade CdrMemberBook v1.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v1.8.0.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.8.0 update
        run: python3 .github/scripts/upgrade_v180.py

      - name: Build with Maven
        run: mvn -B clean package

      - name: Commit v1.8.0
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src
          git commit -m "feat: add smart menu conditions and native reports v1.8.0"
          git push
