name: Upgrade CdrMemberBook v1.6.1 + v1.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v1.6.1-v1.7.0.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.6.1 stability update
        run: python3 .github/scripts/upgrade_v161_v170.py stability

      - name: Build v1.6.1
        run: mvn -B clean package

      - name: Commit v1.6.1
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src
          git commit -m "fix: stabilize Member Book modes v1.6.1"

      - name: Apply v1.7.0 first join tutorial
        run: python3 .github/scripts/upgrade_v161_v170.py tutorial

      - name: Build v1.7.0
        run: mvn -B clean package

      - name: Commit v1.7.0
        run: |
          git add pom.xml README.md CHANGELOG.md src
          git commit -m "feat: add First Join Tutorial v1.7.0"
          git push
