name: Upgrade CdrMemberBook v1.10.0

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/upgrade_v1100.py'
      - '.github/workflows/upgrade-v1.10.0.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply v1.10.0
        run: python3 .github/scripts/upgrade_v1100.py
      - name: Build with Maven
        run: mvn -B -ntp package
      - name: Commit v1.10.0
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Player Preferences v1.10.0"
          git push
