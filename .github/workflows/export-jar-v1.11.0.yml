name: Export CdrMemberBook v1.11.0 JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-jar-v1.11.0.yml'

permissions:
  contents: read

env:
  BUILD_COMMIT: 85e60ce9cd8f9c2f51c9b56081c6cb6b72f8420f

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.11.0 clean head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_COMMIT }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: mvn -B -ntp package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CdrMemberBook-1.11.0
          path: target/CdrMemberBook-1.11.0.jar
          if-no-files-found: error
          retention-days: 7
