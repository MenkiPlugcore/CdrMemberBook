name: Upgrade CdrMemberBook v1.9.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v1.9.2.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.9.2 hardening
        run: python3 .github/scripts/harden_v192.py

      - name: Build with Maven
        run: mvn -B clean package

      - name: Commit v1.9.2
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src
          git commit -m "fix: harden production runtime v1.9.2"
          git push
