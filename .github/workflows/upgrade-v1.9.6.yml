name: Upgrade CdrMemberBook v1.9.6

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/upgrade_v196.py'
      - '.github/workflows/upgrade-v1.9.6.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.9.6
        run: python3 .github/scripts/upgrade_v196.py

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Commit v1.9.6
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Java native report submit v1.9.6"
          git push
