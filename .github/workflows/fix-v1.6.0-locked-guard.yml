name: Fix CdrMemberBook v1.6.0 Locked Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v1.6.0-locked-guard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Patch locked inventory guard
        run: python3 .github/scripts/fix_v160_locked_guard.py

      - name: Build with Maven
        run: mvn -B clean package

      - name: Commit fix
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add src/main/java/id/cadera/memberbook/item/MemberBookService.java
          git commit -m "fix: decouple locked mode from storage protection"
          git push
