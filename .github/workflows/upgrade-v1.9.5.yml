name: Upgrade CdrMemberBook v1.9.5

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/upgrade_v195.py'
      - '.github/scripts/fix_upgrade_v195.py'
      - '.github/scripts/postfix_v195.py'
      - '.github/workflows/upgrade-v1.9.5.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Patch upgrade markers
        run: python3 .github/scripts/fix_upgrade_v195.py
      - name: Apply v1.9.5
        run: python3 .github/scripts/upgrade_v195.py
      - name: Post-patch compile cleanup
        run: python3 .github/scripts/postfix_v195.py
      - name: Build with Maven
        run: mvn -B clean package
      - name: Commit v1.9.5
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Report QoL and Audit v1.9.5"
          git push
