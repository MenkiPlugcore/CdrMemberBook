name: Upgrade CdrMemberBook v1.9.4

on:
  push:
    paths:
      - '.github/scripts/upgrade_v194.py'
      - '.github/workflows/upgrade-v1.9.4.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.9.4
        run: python3 .github/scripts/upgrade_v194.py

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Commit v1.9.4
        run: |
          git config user.name 'MenkiPlugcore'
          git config user.email 'cfirmansyah327@gmail.com'
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: polish Java menu and add Java Report Center v1.9.4'
            git push
          fi
