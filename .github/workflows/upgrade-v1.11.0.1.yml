name: Upgrade CdrMemberBook v1.11.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v1.11.0.1.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply v1.11.0.1
        run: python .github/scripts/upgrade_v11101.py

      - name: Build with Maven
        run: mvn -B -ntp package

      - name: Commit v1.11.0.1
        run: |
          git config user.name "MenkiPlugcore"
          git config user.email "cfirmansyah327@gmail.com"
          git add pom.xml README.md CHANGELOG.md src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: improve Bedrock Member Book interaction v1.11.0.1"
            git push
          fi
